
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        run: |
          echo "Checking website directory..."
          ls -la ./HuynhManDat
          test -f ./HuynhManDat/index.html
          echo "index.html found!"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./HuynhManDat

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tranh thủy mặc minh họa núi sông Nam Bộ">
  <defs>
    <radialGradient id="sky" cx="62%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#6b4a33" stop-opacity=".55"/>
      <stop offset="48%" stop-color="#3a2b21" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#201c18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#e4cfa3" stop-opacity=".85"/>
      <stop offset="35%" stop-color="#d8c39a" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#d8c39a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ebdd" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f2ebdd" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f2ebdd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2520" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#201c18" stop-opacity=".95"/>
    </linearGradient>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .022" numOctaves="4" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1080" cy="214" r="260" fill="url(#moonGlow)"/>
  <circle cx="1080" cy="214" r="86" fill="#e4cfa3" opacity=".22"/>
  <circle cx="1080" cy="214" r="86" fill="none" stroke="#d8c39a" stroke-opacity=".35"/>

  <g fill="none" stroke="#201c18" stroke-linecap="round" opacity=".55" filter="url(#softSm)">
    <path d="M300 170 q14 -12 28 0 q14 12 28 0" stroke-width="3"/>
    <path d="M372 142 q10 -9 20 0 q10 9 20 0" stroke-width="2.4"/>
    <path d="M262 130 q8 -7 16 0 q8 7 16 0" stroke-width="2"/>
    <path d="M1210 300 q10 -9 20 0 q10 9 20 0" stroke-width="2.2"/>
  </g>

  <path d="M-40 560 L120 410 C170 356 214 372 254 420 L330 514 L420 392 C474 314 530 330 580 412 L668 540 L758 424 C812 354 864 362 912 432 L1010 566 L1110 450 C1164 388 1216 396 1268 458 L1370 580 L1470 470 C1522 418 1574 426 1640 490 L1640 900 L-40 900 Z" fill="#6b4a33" opacity=".18" filter="url(#ink)"/>

  <path d="M-40 660 L80 560 C138 512 188 526 232 580 L302 672 L398 548 C456 478 512 490 562 566 L646 680 L742 570 C804 508 860 518 914 580 L1000 686 L1100 584 C1156 536 1212 544 1264 602 L1350 700 L1450 610 C1510 566 1566 574 1640 630 L1640 900 L-40 900 Z" fill="#2a211b" opacity=".55" filter="url(#ink)"/>

  <ellipse cx="440" cy="620" rx="430" ry="52" fill="url(#mist)" filter="url(#soft)"/>
  <ellipse cx="1080" cy="660" rx="480" ry="46" fill="url(#mist)" filter="url(#soft)"/>
  <ellipse cx="810" cy="610" rx="330" ry="30" fill="url(#mist)" filter="url(#soft)"/>

  <path d="M-40 770 C140 720 250 752 390 736 C530 720 640 692 790 720 C940 748 1060 778 1200 748 C1340 718 1470 722 1640 770 L1640 900 L-40 900 Z" fill="#201c18" opacity=".86" filter="url(#ink)"/>
  <path d="M-40 790 C160 758 300 784 460 772 C620 760 760 736 920 762 C1080 788 1240 806 1400 782 C1490 768 1570 772 1640 790 L1640 900 L-40 900 Z" fill="url(#water)"/>

  <g stroke="#d8c39a" stroke-linecap="round" opacity=".16">
    <path d="M120 812 h230" stroke-width="1.4"/>
    <path d="M370 836 h160" stroke-width="1"/>
    <path d="M620 812 h260" stroke-width="1.2"/>
    <path d="M940 842 h210" stroke-width="1"/>
    <path d="M1180 816 h250" stroke-width="1.3"/>
    <path d="M260 864 h170" stroke-width="1"/>
    <path d="M720 870 h230" stroke-width="1.1"/>
    <path d="M1060 872 h180" stroke-width=".9"/>
  </g>

  <g transform="translate(690 690) scale(.9)" fill="#201c18">
    <path d="M0 28 C40 18 110 18 156 28 C130 44 28 44 0 28 Z"/>
    <path d="M22 24 C44 6 108 6 134 24 C104 16 52 16 22 24 Z" opacity=".85"/>
    <path d="M70 4 L70 -34" stroke="#201c18" stroke-width="3"/>
    <path d="M70 8 C52 0 40 -6 30 -16 C48 -12 60 -8 70 2 Z"/>
    <path d="M70 8 C52 0 40 -6 30 -16 C48 -12 60 -8 70 2 Z" transform="translate(140 0) scale(-1 1)" opacity=".9"/>
    <path d="M58 -30 C58 -40 82 -40 82 -30 L82 -16 L58 -16 Z" opacity=".9"/>
    <path d="M64 -22 L64 -34" stroke="#201c18" stroke-width="2"/>
  </g>

  <g stroke="#201c18" stroke-linecap="round" fill="none" opacity=".7">
    <path d="M150 790 C144 720 152 660 176 610" stroke-width="4"/>
    <path d="M180 792 C184 730 196 682 218 646" stroke-width="3"/>
    <path d="M205 792 C212 744 228 706 252 678" stroke-width="2.5"/>
    <path d="M176 610 C164 588 160 570 166 548" stroke-width="2"/>
    <path d="M176 610 C190 590 202 580 218 574" stroke-width="2"/>
    <path d="M218 646 C204 632 196 618 194 600" stroke-width="2"/>
    <path d="M218 646 C232 634 244 628 258 626" stroke-width="2"/>
    <path d="M252 678 C244 660 242 646 246 632" stroke-width="2"/>
  </g>
  <g fill="#201c18" opacity=".55">
    <ellipse cx="185" cy="574" rx="18" ry="4" transform="rotate(-48 185 574)"/>
    <ellipse cx="210" cy="560" rx="16" ry="3.6" transform="rotate(-32 210 560)"/>
    <ellipse cx="240" cy="642" rx="17" ry="3.8" transform="rotate(-40 240 642)"/>
    <ellipse cx="266" cy="620" rx="15" ry="3.4" transform="rotate(-25 266 620)"/>
    <ellipse cx="150" cy="586" rx="16" ry="3.6" transform="rotate(56 150 586)"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity=".28"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa nghệ thuật: nho sĩ Việt Nam thế kỷ XIX</title>
  <desc id="desc">Tranh mực tàu cách điệu vẽ một vị nho sĩ đội khăn vấn, râu dài, tay cầm cuộn thư, trong khung tròn có núi mờ và con dấu đỏ. Đây là hình minh họa nghệ thuật, không phải chân dung tư liệu của Huỳnh Mẫn Đạt.</desc>
  <defs>
    <radialGradient id="paper" cx="45%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#f7efdf"/>
      <stop offset="58%" stop-color="#e8d9ba"/>
      <stop offset="100%" stop-color="#cdb489"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31261f"/>
      <stop offset="55%" stop-color="#201c18"/>
      <stop offset="100%" stop-color="#4b3025"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b98c"/>
      <stop offset="100%" stop-color="#b98f60"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4cfa3"/>
      <stop offset="50%" stop-color="#b28a4b"/>
      <stop offset="100%" stop-color="#8b6a37"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ebdd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f2ebdd" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#f2ebdd" stop-opacity="0"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="400" cy="445" r="330"/>
    </clipPath>
    <pattern id="fibre" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 4h18M0 13h18" stroke="#4b3025" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <circle cx="400" cy="445" r="356" fill="#d8c39a" opacity=".38"/>
  <circle cx="400" cy="445" r="344" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="400" cy="445" r="333" fill="url(#paper)"/>

  <g clip-path="url(#circleClip)">
    <rect width="800" height="900" fill="url(#paper)"/>
    <circle cx="540" cy="300" r="78" fill="#873d32" opacity=".16"/>
    <circle cx="540" cy="300" r="78" fill="none" stroke="#873d32" stroke-opacity=".18"/>

    <path d="M-30 620 L90 500 C130 458 168 470 200 505 L270 590 L330 500 C372 438 422 450 462 512 L516 590 L585 505 C625 458 675 466 720 515 L830 630 L830 900 L-30 900 Z" fill="#4b3025" opacity=".14" filter="url(#rough)"/>
    <path d="M-20 680 L80 610 C130 575 168 586 206 628 L260 696 L322 624 C370 570 420 582 462 636 L520 700 L580 640 C630 594 682 602 730 648 L840 730 L840 900 L-20 900 Z" fill="#201c18" opacity=".18" filter="url(#rough)"/>
    <path d="M-10 755 C90 716 150 760 228 744 C310 727 360 700 432 720 C512 742 552 768 630 744 C690 726 744 736 818 770 L818 900 L-10 900 Z" fill="#201c18" opacity=".32" filter="url(#rough)"/>

    <ellipse cx="300" cy="590" rx="290" ry="56" fill="url(#mist)" filter="url(#soft)"/>
    <ellipse cx="560" cy="520" rx="250" ry="42" fill="url(#mist)" filter="url(#soft)"/>

    <g opacity=".45" stroke="#3b2b20" fill="none" stroke-linecap="round" filter="url(#soft2)">
      <path d="M110 700 C150 650 180 590 185 505" stroke-width="7"/>
      <path d="M124 664 C165 638 190 604 198 568" stroke-width="4"/>
      <path d="M145 690 C185 686 218 670 242 642" stroke-width="4"/>
      <path d="M170 630 C141 606 128 584 124 557" stroke-width="4"/>
      <path d="M188 585 C215 575 235 560 248 538" stroke-width="3"/>
      <path d="M174 690 C152 706 136 724 130 748" stroke-width="3"/>
    </g>
    <g fill="#3b2b20" opacity=".38">
      <ellipse cx="196" cy="551" rx="20" ry="5" transform="rotate(-38 196 551)"/>
      <ellipse cx="243" cy="630" rx="20" ry="5" transform="rotate(-33 243 630)"/>
      <ellipse cx="127" cy="595" rx="17" ry="4.5" transform="rotate(27 127 595)"/>
      <ellipse cx="249" cy="526" rx="16" ry="4" transform="rotate(-45 249 526)"/>
      <ellipse cx="149" cy="724" rx="18" ry="4.5" transform="rotate(48 149 724)"/>
    </g>

    <g opacity=".3" fill="none" stroke="#201c18" stroke-width="2" stroke-linecap="round">
      <path d="M590 190 q10 -8 20 0 q10 8 20 0"/>
      <path d="M636 168 q7 -6 14 0 q7 6 14 0"/>
    </g>

    <path d="M212 900 C226 748 294 646 400 626 C506 646 574 748 588 900 Z" fill="url(#robe)" filter="url(#rough)"/>
    <path d="M302 900 C306 770 330 690 400 680 C470 690 494 770 498 900 Z" fill="#4b3025" opacity=".55"/>
    <path d="M330 900 C338 782 356 708 400 700 C444 708 462 782 470 900 Z" fill="#201c18"/>

    <path d="M332 662 C346 630 366 612 400 606 C434 612 454 630 468 662 L430 700 L400 678 L370 700 Z" fill="#e6d5b5"/>
    <path d="M366 624 C374 660 388 680 400 694 C412 680 426 660 434 624" fill="none" stroke="#b28a4b" stroke-width="3"/>
    <path d="M400 694 L400 900" stroke="#201c18" stroke-width="2" opacity=".45"/>

    <path d="M290 704 C250 738 236 790 242 856 L282 856 C278 808 290 770 318 744 Z" fill="#3a2b21" opacity=".9"/>
    <path d="M510 704 C550 738 564 790 558 856 L518 856 C522 808 510 770 482 744 Z" fill="#3a2b21" opacity=".9"/>
    <path d="M242 856 C252 870 268 878 282 878" fill="none" stroke="#b28a4b" stroke-width="2" opacity=".6"/>
    <path d="M558 856 C548 870 532 878 518 878" fill="none" stroke="#b28a4b" stroke-width="2" opacity=".6"/>

    <path d="M400 548 L400 608" stroke="#9c7546" stroke-width="34" stroke-linecap="round"/>
    <ellipse cx="400" cy="446" rx="72" ry="92" fill="url(#skin)"/>
    <path d="M328 446 C328 380 356 342 400 342 C444 342 472 380 472 446 C472 486 456 516 434 538 C446 508 448 486 442 468 C424 482 376 482 358 468 C352 486 354 508 366 538 C344 516 328 486 328 446 Z" fill="#2a211b" opacity=".95"/>
    <path d="M350 505 C358 548 380 584 400 598 C420 584 442 548 450 505 C438 526 420 536 400 536 C380 536 362 526 350 505 Z" fill="#241d18"/>
    <path d="M372 536 C384 544 416 544 428 536 C424 552 414 560 400 560 C386 560 376 552 372 536 Z" fill="#873d32" opacity=".65"/>
    <path d="M368 486 C380 478 392 478 400 484" fill="none" stroke="#3a2b21" stroke-width="4" stroke-linecap="round"/>
    <path d="M432 486 C420 478 408 478 400 484" fill="none" stroke="#3a2b21" stroke-width="4" stroke-linecap="round"/>
    <path d="M360 462 C372 454 386 454 396 460" fill="none" stroke="#2a211b" stroke-width="5" stroke-linecap="round"/>
    <path d="M440 462 C428 454 414 454 404 460" fill="none" stroke="#2a211b" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 466 C398 480 396 492 400 500" fill="none" stroke="#8a6339" stroke-width="3" stroke-linecap="round" opacity=".7"/>

    <path d="M316 420 C306 350 340 302 400 302 C460 302 494 350 484 420 C470 404 452 392 430 386 L430 410 C414 404 386 404 370 410 L370 386 C348 392 330 404 316 420 Z" fill="#2a211b"/>
    <path d="M316 420 C330 380 354 366 400 366 C446 366 470 380 484 420 C466 402 440 394 400 394 C360 394 334 402 316 420 Z" fill="#4b3025"/>
    <path d="M330 390 C342 350 366 330 400 330 C434 330 458 350 470 390" fill="none" stroke="#6b4a33" stroke-width="4" opacity=".55"/>
    <path d="M318 432 C306 476 306 514 318 548 L350 536 C338 500 338 468 348 440 Z" fill="#2a211b"/>
    <path d="M482 432 C494 476 494 514 482 548 L450 536 C462 500 462 468 452 440 Z" fill="#2a211b"/>

    <path d="M300 690 C334 670 366 670 398 686 L400 714 C368 698 336 698 306 718 Z" fill="#e9d9ba" stroke="#b28a4b" stroke-width="2"/>
    <path d="M500 690 C466 670 434 670 402 686 L400 714 C432 698 464 698 494 718 Z" fill="#e9d9ba" stroke="#b28a4b" stroke-width="2"/>
    <ellipse cx="366" cy="694" rx="18" ry="21" fill="url(#skin)" transform="rotate(-18 366 694)"/>
    <ellipse cx="434" cy="694" rx="18" ry="21" fill="url(#skin)" transform="rotate(18 434 694)"/>
    <rect x="398" y="672" width="4" height="50" fill="#873d32" opacity=".8"/>
    <g transform="rotate(-4 400 700)">
      <rect x="344" y="688" width="112" height="42" rx="4" fill="#f2ebdd" stroke="#b28a4b" stroke-width="2"/>
      <path d="M360 700 h72 M360 710 h64 M360 720 h48" stroke="#4b3025" stroke-width="2" opacity=".35"/>
      <rect x="430" y="696" width="16" height="16" fill="#873d32"/>
      <text x="438" y="708" font-family="serif" font-size="10" fill="#f2ebdd" text-anchor="middle">達</text>
    </g>

    <rect width="800" height="900" fill="url(#fibre)"/>
    <rect width="800" height="900" filter="url(#grain)" opacity=".35"/>
  </g>

  <circle cx="400" cy="445" r="333" fill="none" stroke="#4b3025" stroke-opacity=".28"/>
  <circle cx="400" cy="445" r="322" fill="none" stroke="#b28a4b" stroke-opacity=".45" stroke-dasharray="1 6"/>

  <g font-family="'Noto Serif CJK SC','Songti SC','SimSun',serif" font-size="42" fill="#4b3025" text-anchor="middle" opacity=".62">
    <text x="704" y="300">黃</text>
    <text x="704" y="356">敏</text>
    <text x="704" y="412">達</text>
  </g>

  <g transform="translate(154 646) rotate(-4)">
    <rect width="82" height="82" rx="4" fill="#873d32"/>
    <rect x="7" y="7" width="68" height="68" rx="2" fill="none" stroke="#f2ebdd" stroke-width="2" opacity=".9"/>
    <text x="41" y="55" font-family="'Noto Serif CJK SC','Songti SC','SimSun',serif" font-size="38" fill="#f2ebdd" text-anchor="middle" opacity=".92">達</text>
  </g>

  <path d="M190 806 C260 790 330 798 400 806 C470 798 540 790 610 806" fill="none" stroke="#b28a4b" stroke-width="1.5" opacity=".55"/>
  <text x="400" y="838" font-family="'Be Vietnam Pro',sans-serif" font-size="13" letter-spacing="5" fill="#4b3025" text-anchor="middle" opacity=".62">MINH HỌA NGHỆ THUẬT</text>
</svg>
